name: release-client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: windows
            arch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - name: Download EasyTier Core
        env:
          EASYTIER_VERSION: ${{ vars.EASYTIER_VERSION || 'v2.6.4' }}
        working-directory: client
        run: ./scripts/fetch-easytier-core.sh
      - name: Build client
        env:
          TARGETS: ${{ matrix.os }}/${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          SERVER_URL: ${{ vars.VPN_SERVER_URL }}
          EASYTIER_CORE_DIR: cores
        working-directory: client
        run: OUT_DIR=dist ./scripts/package-client.sh
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-vpn-client-${{ matrix.os }}-${{ matrix.arch }}
          path: client/dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: enterprise-vpn-client-*
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
