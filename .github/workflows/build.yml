name: build-tauri-client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin/arm64
            rust_target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - os: windows-2022
            target: windows/amd64
            rust_target: x86_64-pc-windows-msvc
            bundles: msi
            artifact: windows-x86_64
          - os: windows-2022
            target: windows/arm64
            rust_target: aarch64-pc-windows-msvc
            bundles: msi
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          cargo_text = cargo.read_text(encoding="utf-8")
          cargo_text = re.sub(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              cargo_text,
              count=1,
          )
          cargo.write_text(cargo_text, encoding="utf-8")

          config = pathlib.Path("src-tauri/tauri.conf.json")
          data = json.loads(config.read_text(encoding="utf-8"))
          data["version"] = version
          config.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4
      - name: Download EasyTier Core
        env:
          EASYTIER_VERSION: ${{ vars.EASYTIER_VERSION || 'v2.6.4' }}
        shell: bash
        run: ./scripts/fetch-easytier-core.sh
      - name: Build installer
        env:
          TARGETS: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact }}
          VPN_SERVER_URL: ${{ vars.VPN_SERVER_URL || 'http://172.22.159.5:4096' }}
          EASYTIER_CORE_DIR: cores
        shell: bash
        run: ./scripts-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-vpn-client-${{ matrix.artifact }}
          path: dist/*${{ matrix.artifact }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: enterprise-vpn-client-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Enterprise VPN $TAG" \
            --generate-notes
